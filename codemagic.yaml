workflows:
  ios-release-no-shorebird:
    name: iOS Release
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - flutter pub get
      - flutter build ios --release --no-codesign
      - mkdir -p build/ios/ipa/Payload
      - cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
      - cd build/ios/ipa
      - zip -r Runner-unsigned.ipa Payload
    artifacts:
      - build/ios/ipa/Runner-unsigned.ipa
